name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Recreate Android Framework & Build
        run: |
          cp lib/main.dart lib/main.dart.bak
          flutter create . --org com.seafalcons.app --project-name marine_survey_app --overwrite
          mv lib/main.dart.bak lib/main.dart
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sea-Falcons-App
          path: build/app/outputs/flutter-apk/app-release.apk
