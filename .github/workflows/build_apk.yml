name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.seafalcons.app marine_survey_app
          cp -r marine_survey_app/android ../
          cp -r marine_survey_app/web ../ 2>/dev/null || true
          cp marine_survey_app/pubspec.yaml ../
          cd ..
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Sea-Falcons-App
          path: build/app/outputs/flutter-apk/app-release.apk
